<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&display=swap" rel="stylesheet"><title>Micro Mind Pro</title><style>
:root{--bg:#070b1c;--gl:rgba(16,23,50,.82);--bd:rgba(255,255,255,.09);--tx:#e6ecff;--mu:#7f8db8;--ac:#00e5ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.ib{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);width:46px;height:46px;border-radius:16px;border:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(14px);display:grid;place-items:center;z-index:5;transition:transform .25s,box-shadow .25s}
.ib:active{transform:scale(.92)}#mb{left:12px}#sb{right:12px}
#wm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 24px);left:0;right:0;text-align:center;font-weight:700;letter-spacing:.14em;font-size:14px;color:var(--ac);text-shadow:0 0 14px var(--ac);pointer-events:none;transition:opacity .3s}
#sbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:66px;right:66px;z-index:5;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.3s cubic-bezier(.2,.8,.2,1)}
#sbar.o{opacity:1;transform:none;pointer-events:auto}
#q{width:100%;height:46px;margin:0;border-radius:16px;padding:0 16px}
#rs{margin-top:8px;border-radius:16px;background:var(--gl);backdrop-filter:blur(14px);border:1px solid var(--bd);overflow:hidden;display:none}
#rs.o{display:block}
.rr{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd);animation:up .35s both;animation-delay:calc(var(--i)*45ms)}
.rr:last-child{border:0}.rr small{color:var(--mu);margin-left:auto}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:currentColor;box-shadow:0 0 10px currentColor}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
#fab,#plan-fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:62px;height:62px;border-radius:22px;border:0;color:#04101f;background:var(--ac);display:grid;place-items:center;z-index:5;box-shadow:0 0 26px rgba(0,229,255,.55);transition:transform .25s}
#fab:active,#plan-fab:active{transform:scale(.9) rotate(90deg)}
#plan-fab{display:none}
#em{position:fixed;left:0;right:0;top:42%;text-align:center;color:var(--mu);padding:0 40px;pointer-events:none;animation:up .8s both}
#bg,#bg2{position:fixed;inset:0;background:rgba(2,4,14,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:6}
#bg2{z-index:8}#bg.o,#bg2.o{opacity:1;pointer-events:auto}
#sh,#dr,#pk{position:fixed;background:rgba(13,19,42,.94);backdrop-filter:blur(20px);border:1px solid var(--bd);z-index:7;overflow:auto;padding:20px}
#sh,#dr{transition:transform .45s cubic-bezier(.16,1,.3,1)}
#sh{left:0;right:0;bottom:0;max-height:90%;border-radius:26px 26px 0 0;transform:translateY(105%);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
#dr{top:0;bottom:0;left:0;width:82%;max-width:350px;border-radius:0 26px 26px 0;transform:translateX(-105%);padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
#sh.o,#dr.o{transform:none}
#pk{z-index:9;left:7%;right:7%;top:20%;max-height:62%;border-radius:22px;opacity:0;transform:scale(.92) translateY(14px);pointer-events:none;transition:.3s cubic-bezier(.2,.9,.3,1.1)}
#pk.o{opacity:1;transform:none;pointer-events:auto}
input,textarea,select{width:100%;background:rgba(255,255,255,.045);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;margin:6px 0;outline:0;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(0,229,255,.14)}
textarea{resize:vertical}
label,.mu{color:var(--mu);font-size:13px}label{display:block;margin-top:10px}
h2,h3{margin:0 0 6px;font-weight:650}
.fld{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.045);margin:6px 0}
.fld span{flex:1;text-align:left}
#st,#st-task{display:flex;gap:8px;margin:8px 0}#st svg,#st-task svg{cursor:pointer;transition:transform .2s,opacity .2s}#st svg:active,#st-task svg:active{transform:scale(1.25)}
.pri{width:100%;padding:15px;border:0;border-radius:16px;color:#04101f;font-weight:700;font-size:16px;background:var(--ac);margin-top:14px;box-shadow:0 0 22px rgba(0,229,255,.35);display:flex;justify-content:center;gap:8px;align-items:center}
.bt{display:flex;gap:10px;margin-top:16px}.bt button{flex:1;padding:14px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.05);display:flex;justify-content:center;gap:8px;align-items:center;font-weight:600}
.bt .dn{color:#ff5d7a}.bt .pri{margin:0;color:#04101f}
.chip{display:inline-flex;align-items:center;gap:8px;color:var(--mu);font-size:14px;margin-bottom:12px}
.tx{white-space:pre-wrap;line-height:1.55;margin:0 0 6px}
.ph{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;margin-bottom:14px;animation:up .5s both}
.act{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.045);color:var(--ac);text-decoration:none;margin-top:8px;word-break:break-all}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);animation:up .4s both;animation-delay:calc(var(--i)*40ms)}
.row b{flex:1;font-weight:500}.row small{color:var(--mu)}
.row button,.sw{background:none;border:0;padding:6px;color:var(--mu)}
.dotb{width:26px;height:26px;border-radius:50%;border:0;padding:0;background:currentColor;box-shadow:0 0 12px currentColor}
.sws{display:flex;flex-wrap:wrap;gap:12px;padding:12px 0;animation:up .3s both}
.sws i{width:28px;height:28px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor;cursor:pointer}
.pit{display:flex;align-items:center;gap:12px;padding:14px 8px;border-radius:12px;cursor:pointer;animation:up .35s both;animation-delay:calc(var(--i)*35ms)}
.pit b{flex:1;font-weight:500}.pit:active{background:rgba(255,255,255,.06)}
.add{display:flex;gap:8px;margin-top:10px}.add button{width:50px;border:0;border-radius:14px;background:var(--ac);color:#04101f;display:grid;place-items:center;margin:6px 0}
#dr{display:flex;flex-direction:column}#dr>*{flex:none}.sp{flex:1 0 16px!important}
#bgi,#mem i{position:fixed;inset:0;background-size:cover;background-position:center;pointer-events:none}
#bgi{opacity:.32;filter:blur(2px) saturate(1.1);display:none}
#bgi::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 15%,var(--bg) 95%)}
#mem i{opacity:0;filter:blur(7px) saturate(1.2);transition:opacity 3s ease}#mem i.o{opacity:.15}
.logo{color:var(--ac);text-shadow:0 0 14px var(--ac);letter-spacing:.12em;margin-bottom:14px}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:15px 12px;margin-bottom:8px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.04);animation:up .4s both;animation-delay:calc(var(--i)*60ms)}
.mi span{flex:1;text-align:left}.mi svg:last-child{transform:rotate(-90deg);opacity:.5}
.bk{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0 14px;font-size:18px;font-weight:650}
.acc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:1px solid var(--bd);background:rgba(255,255,255,.05);backdrop-filter:blur(12px)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(0,229,255,.15);color:var(--ac);font-weight:700}
.bs{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.bs i{width:36px;height:36px;border-radius:12px;border:1px solid var(--bd);cursor:pointer}
#nb{right:12px}#sb{right:66px}#sbar{right:122px}
.bdg{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#ff3d6e;box-shadow:0 0 8px #ff3d6e}
#dt,#cm{top:calc(env(safe-area-inset-top,0px) + 66px);right:69px;width:40px;height:40px;border-radius:14px}
#cm{top:calc(env(safe-area-inset-top,0px) + 114px);opacity:0;transform:translateY(-10px) scale(.8);pointer-events:none;transition:.3s cubic-bezier(.2,.9,.3,1.2);color:var(--ac)}
#cm.o{opacity:1;transform:none;pointer-events:auto}
#ts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-30px);opacity:0;display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(255,196,0,.22),rgba(16,23,50,.92));border:1px solid rgba(255,196,0,.5);color:#ffd966;z-index:9;transition:.5s cubic-bezier(.2,.9,.3,1.1);pointer-events:none;white-space:nowrap}
#ts.o{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.tr{text-align:center;padding:10px 0}.big{font:800 54px Orbitron,system-ui,sans-serif;background:linear-gradient(#fff3a8,#ffc400 55%,#c47a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,196,0,.6));margin:6px 0}.big small{font-size:20px;margin-left:6px}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.mp{color:#ffc400;font:700 13px Orbitron,system-ui,sans-serif;text-shadow:0 0 10px rgba(255,196,0,.6)}.mpb{text-align:center;margin:0 0 14px}.mpb b{display:block}
.chs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chs button{padding:9px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.04);transition:.25s;display:flex;align-items:center;gap:6px}.chs button.on{background:rgba(0,229,255,.16);border-color:var(--ac);color:var(--ac);box-shadow:0 0 12px rgba(0,229,255,.25)}
#ob{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 30px}#ob.o{display:block;animation:up .5s both}.obc{max-width:440px;margin:0 auto}
.shb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.shb a,.shb button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--tx);text-decoration:none;font-size:12px}

/* Reja/vaqt tugmasi va reja oynasi dizayni */
#plan-btn{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:62px;height:62px;border-radius:22px;border:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(14px);display:grid;place-items:center;z-index:5;box-shadow:0 0 20px rgba(0,229,255,.2);transition:transform .25s,box-shadow .25s}
#plan-btn:active{transform:scale(.9)}
#plans-view{position:fixed;inset:0;background:var(--bg);z-index:4;display:none;padding:calc(env(safe-area-inset-top,0px) + 70px) 20px calc(env(safe-area-inset-bottom,0px) + 90px) 20px;overflow-y:auto;opacity:0;transform:translateY(20px);transition:opacity .35s cubic-bezier(.2,.8,.2,1), transform .35s cubic-bezier(.2,.8,.2,1)}
#plans-view.o{display:block;opacity:1;transform:none}
.p-container{max-width:500px;margin:0 auto}
.p-card{background:rgba(255,255,255,.03);border:1px solid var(--bd);backdrop-filter:blur(16px);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.task-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.04);margin-bottom:10px;animation:up .35s both;animation-delay:calc(var(--i)*40ms);transition:all .25s}
.task-item span{font-weight:500;font-size:15px}
.task-item.done .task-title{text-decoration:line-through;color:var(--mu)}
.task-chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;cursor:pointer;transition:all .25s;flex:none}
.task-item.done .task-chk{border-color:#2dffb3;background:#2dffb3;color:#04101f;box-shadow:0 0 12px rgba(45,255,179,0.5)}
.point-pop{position:fixed;color:#ffd60a;font-family:'Orbitron',system-ui,sans-serif;font-weight:800;font-size:18px;pointer-events:none;z-index:25;animation:floatUp 1s forwards ease-out;text-shadow:0 0 12px rgba(255,214,10,0.8)}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(1.3)}}
</style></head><body>
<div id="bgi"></div><div id="mem"><i></i><i></i></div>
<canvas id="c"></canvas>
<div id="wm">MICRO MIND</div>
<button class="ib" id="mb" aria-label="Menyu"></button>
<div id="sbar"><input id="q" placeholder="Qidiruv…"><div id="rs"></div></div>
<button class="ib" id="sb" aria-label="Search"></button><button class="ib" id="nb" aria-label="Notifications"></button><button class="ib" id="dt" aria-label="More"></button><button class="ib" id="cm" aria-label="Share card"></button>
<div id="em"></div>

<!-- 1-bo'lim uchun asosiy + tugmasi -->
<button id="fab" aria-label="Qo’shish"></button>

<!-- 2-bo'lim uchun pastki o'ng burchakdagi reja qo'shish + tugmasi -->
<button id="plan-fab" aria-label="Reja qo'shish"></button>

<!-- Pastki chap burchakdagi reja/vaqt tugmasi -->
<button id="plan-btn" aria-label="Rejalar"></button>

<!-- Rejalar (Todoist) bo'limi oynasi -->
<div id="plans-view">
  <div class="p-container">
    <h2 class="logo" id="l-tasks-title">KUNLIK REJALAR</h2>
    <div class="p-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <b id="l-prog">Bajarilish darajasi</b>
        <span id="p-percent" style="font-family:'Orbitron',sans-serif;color:#2dffb3;font-weight:800">0%</span>
      </div>
      <div style="width:100%;height:8px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden">
        <div id="p-bar" style="width:0%;height:100%;background:linear-gradient(90deg,var(--ac),#2dffb3);transition:width .4s ease"></div>
      </div>
      <small id="p-sub" class="mu" style="display:block;margin-top:6px">0 / 0 bajarildi · Har bir vazifa +10 MP</small>
    </div>
    <div id="tasks-container"></div>
  </div>
</div>

<div id="ts"></div><div id="ob"></div><div id="bg"></div><div id="bg2"></div><div id="sh"></div><div id="dr"></div><div id="pk"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IC={
  menu:"M4 7h16M4 12h10M4 17h16",search:"M11 4.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM16 16l4.5 4.5",plus:"M12 5v14M5 12h14",x:"M6 6l12 12M18 6L6 18",edit:"M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4",trash:"M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12",phone:"M6 4h3l1.5 4-2 1.5a11 11 0 005 5l1.5-2 4 1.5v3a2 2 0 01-2 2A13 13 0 014 6a2 2 0 012-2z",link:"M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1",image:"M5 5h14a1 1 0 011 1v12a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1zM9 10a1.2 1.2 0 100-2.4A1.2 1.2 0 009 10zM4 17l5-4 4 3 3-2 4 3",check:"M5 12.5l4.5 4.5L19 7",chev:"M7 10l5 5 5-5",eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6z",sliders:"M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4",globe:"M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z",help:"M12 3a9 9 0 100 18 9 9 0 000-18zM9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1-1.5 2M12 17h0",user:"M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c0-3.5 3.6-6 8-6s8 2.5 8 6",back:"M15 6l-6 6 6 6",bell:"M6 17v-6a6 6 0 1112 0v6l1.5 2h-15L6 17zM10 21h4",dots:"M12 5h.01M12 12h.01M12 19h.01",camera:"M4 8h3l1.5-2h7L17 8h3v11H4V8zM12 16.5a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4z",download:"M12 4v11M8 11l4 4 4-4M5 20h14",upload:"M12 20V9M8 13l4-4 4 4M5 4h14",trophy:"M8 4h8v6a4 4 0 01-8 0V4zM8 6H5v1a3 3 0 003 3M16 6h3v1a3 3 0 01-3 3M12 14v4M8 20h8",tg:"M21 4L3 11l6.5 2.5L12 20l3-4.5L20 19z",wa:"M4 20l1.3-4.2A8 8 0 1112 20a8 8 0 01-3.8-1L4 20z",ig:"M7 3h10a4 4 0 014 4v10a4 4 0 01-4 4H7a4 4 0 01-4-4V7a4 4 0 014-4zM12 16a4 4 0 100-8 4 4 0 000 8zM17.5 6.5h.01",eyeoff:"M3 3l18 18M10 6.2A9 9 0 0112 6c6 0 10 6 10 6a17 17 0 01-3.2 3.8M6.2 7.6A17 17 0 002 12s4 7 10 7a9 9 0 004-1",clock:"M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16zm1-13h-2v6l5 3 .75-1.23-4.25-2.5V7z"
};
const ic=(n,s=22,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n]}"/></svg>`;
const star=(on,s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="opacity:${on?1:.25};color:#ffd60a;filter:${on?"drop-shadow(0 0 5px #ffd60a)":"none"}" fill="currentColor"><path d="M12 3.5l2.6 5.6 6 .7-4.5 4.1 1.3 6L12 16.9 6.6 19.9l1.3-6L3.4 9.8l6-.7z"/></svg>`;

// Default anonim avatar (SVG data URI)
const ANON_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%237f8db8'><rect width='100' height='100' fill='%23101732'/><path d='M50 50a20 20 0 100-40 20 20 0 000 40zm0 10c-13.3 0-40 6.7-40 20v10h80V80c0-13.3-26.7-20-40-20z' fill='%2300e5ff'/></svg>";

$("mb").innerHTML=ic("menu");$("sb").innerHTML=ic("search");$("fab").innerHTML=ic("plus",32);
$("plan-fab").innerHTML=ic("plus",32);
$("plan-btn").innerHTML=ic("clock",26);

let inPlans = false;
$("plan-btn").onclick = () => {
  inPlans = !inPlans;
  $("plans-view").classList.toggle("o", inPlans);
  $("plan-btn").innerHTML = ic(inPlans ? "back" : "clock", 26);
  
  $("fab").style.display = inPlans ? "none" : "grid";
  $("sb").style.display = inPlans ? "none" : "grid";
  $("dt").style.display = inPlans ? "none" : "grid";
  $("cm").style.display = inPlans ? "none" : "grid";
  $("plan-fab").style.display = inPlans ? "grid" : "none";
  if($("sbar").classList.contains("o")) { $("sbar").classList.remove("o"); $("sb").innerHTML = ic("search"); }
  if(inPlans) renderTasks();
};

const NEON=["#00e5ff","#ff3d9a","#b8ff2c","#ffd60a","#a45cff","#ff7a1a","#2dffb3","#4d7cff"];
let S=null;try{S=JSON.parse(localStorage.getItem("micromind2")||localStorage.getItem("micromind1"))}catch(e){}
if(!S||!S.items)S={cats:[{n:"Study",c:NEON[7],on:1},{n:"Run",c:NEON[6],on:1},{n:"Sport",c:NEON[3],on:1},{n:"Boshqa",c:NEON[4],on:1}],items:[]};
if(!S.tasks) S.tasks=[{id:"1",t:"Micro Mind xaritasini o'rganish",d:"Asosiy funksiyalar bilan tanishib chiqish",date:new Date().toISOString().split('T')[0],time:"10:00",s:4,done:false}];
if(S.taskMp===undefined) S.taskMp=0;

function renderTasks() {
  const c = $("tasks-container");
  $("l-tasks-title").textContent = t("tasksTitle");
  $("l-prog").textContent = t("progTitle");
  
  c.innerHTML = S.tasks.length ? S.tasks.map((ts, idx) => `
    <div class="task-item ${ts.done ? 'done' : ''}" style="--i:${idx}" data-id="${ts.id}">
      <div class="task-chk" data-chk="${ts.id}">${ts.done ? ic("check", 16) : ''}</div>
      <div class="task-info" style="flex:1; cursor:pointer;" data-edit="${ts.id}">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <span class="task-title" style="font-weight:600;">${esc(ts.t)}</span>
          <span style="font-size:12px; color:var(--mu);">${ts.date || ''} ${ts.time || ''}</span>
        </div>
        ${ts.d ? `<div style="font-size:13px; color:var(--mu); margin-top:2px;">${esc(ts.d)}</div>` : ''}
      </div>
      <div style="display:flex; gap:2px; align-items:center;">
        ${[1,2,3,4,5].map(n => star(n <= (ts.s || 3), 12)).join("")}
        <button data-deltask="${ts.id}" style="background:none; border:0; color:var(--mu); padding:4px; margin-left:4px;" aria-label="Delete">${ic("trash", 16)}</button>
      </div>
    </div>
  `).join('') : `<p class="mu" style="text-align:center;padding:30px;">${t("noTasks")}</p>`;

  const totalT = S.tasks.length;
  const doneT = S.tasks.filter(x => x.done).length;
  const pct = totalT > 0 ? Math.round((doneT / totalT) * 100) : 0;
  $("p-percent").textContent = pct + "%";
  $("p-bar").style.width = pct + "%";
  $("p-sub").textContent = `${doneT} / ${totalT} ${t("completedText")} · ${t("taskBonus")}`;
}

function showPointPop(text, x, y) {
  const pop = document.createElement('div');
  pop.className = 'point-pop';
  pop.innerText = text;
  pop.style.left = `${x}px`;
  pop.style.top = `${y}px`;
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 1000);
}

$("tasks-container").onclick = e => {
  const chkBtn = e.target.closest("[data-chk]");
  if(chkBtn) {
    const ts = S.tasks.find(x => x.id === chkBtn.dataset.chk);
    if(ts) {
      ts.done = !ts.done;
      const rect = chkBtn.getBoundingClientRect();
      if(ts.done) {
        S.taskMp = (S.taskMp || 0) + 10;
        showPointPop("+10 MP", rect.left, rect.top);
      } else {
        S.taskMp = Math.max(0, (S.taskMp || 0) - 10);
      }
      save(); upd(); renderTasks();
    }
    return;
  }
  const editBtn = e.target.closest("[data-edit]");
  if(editBtn) {
    const ts = S.tasks.find(x => x.id === editBtn.dataset.edit);
    if(ts) taskForm(ts);
    return;
  }
  const delBtn = e.target.closest("[data-deltask]");
  if(delBtn) {
    S.tasks = S.tasks.filter(x => x.id !== delBtn.dataset.deltask);
    save(); upd(); renderTasks();
  }
};

function taskForm(it) {
  const ed = !!it;
  it = it || { t: "", d: "", date: new Date().toISOString().split('T')[0], time: "12:00", s: 3, done: false };
  let s = it.s;
  sheet(`<h3>${t(ed ? "editTask" : "newTask")}</h3>
         <label>${t("taskName")}</label><input id="ftask-t" placeholder="${t("taskNamePH")}" value="${esc(it.t)}">
         <label>${t("taskDesc")}</label><textarea id="ftask-d" rows="3" placeholder="${t("taskDescPH")}">${esc(it.d)}</textarea>
         <label>${t("taskDate")}</label><input id="ftask-date" type="date" value="${esc(it.date)}">
         <label>${t("taskTime")}</label><input id="ftask-time" type="time" value="${esc(it.time)}">
         <label>${t("level")}</label><div id="st-task"></div><p id="sl-task" class="mu"></p>
         <button class="pri" id="ok-task">${ic("check")} ${t("ok")}</button>`);
  
  const r = () => {
    $("st-task").innerHTML = [1,2,3,4,5].map(i => `<span data-i="${i}">${star(i <= s)}</span>`).join("");
    $("sl-task").textContent = LV[S.lang][s-1];
  };
  r();
  $("st-task").onclick = e => { const sp = e.target.closest("span"); if(sp){ s = +sp.dataset.i; r(); } };
  $("ok-task").onclick = () => {
    const name = $("ftask-t").value.trim();
    if(!name) { $("ftask-t").focus(); return; }
    const taskData = {
      t: name,
      d: $("ftask-d").value,
      date: $("ftask-date").value,
      time: $("ftask-time").value,
      s: s,
      done: it.done || false
    };
    if(ed) { Object.assign(it, taskData); }
    else { S.tasks.push({ id: Date.now().toString(36), ...taskData }); }
    save(); upd(); closeS(); renderTasks();
  };
}

$("plan-fab").onclick = () => taskForm();
