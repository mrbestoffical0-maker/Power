<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet"><title>Micro Mind Pro</title><style>
:root{--vi:#7E3BED;--ink:#050a02;--pn:rgba(10,7,18,.95);--bg:#000000;--gl:rgba(14,10,26,.78);--bd:rgba(255,255,255,.09);--tx:#f4f4ff;--mu:#8d8aa8;--ac:#C6FF34;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.ib{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);width:46px;height:46px;border-radius:16px;border:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(14px);display:grid;place-items:center;z-index:5;transition:transform .25s,box-shadow .25s}
.ib:active{transform:scale(.92)}#mb{left:12px}#sb{right:12px}
#wm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 24px);left:0;right:0;text-align:center;font-weight:700;letter-spacing:.14em;font-size:14px;color:var(--ac);text-shadow:0 0 14px var(--ac);pointer-events:none;transition:opacity .3s}
#sbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:66px;right:66px;z-index:5;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.3s cubic-bezier(.2,.8,.2,1)}
#sbar.o{opacity:1;transform:none;pointer-events:auto}
#q{width:100%;height:46px;margin:0;border-radius:16px;padding:0 16px}
#rs{margin-top:8px;border-radius:16px;background:var(--gl);backdrop-filter:blur(14px);border:1px solid var(--bd);overflow:hidden;display:none}
#rs.o{display:block}
.rr{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd);animation:up .35s both;animation-delay:calc(var(--i)*45ms)}
.rr:last-child{border:0}.rr small{color:var(--mu);margin-left:auto}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:currentColor;box-shadow:0 0 10px currentColor}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
#fab,#plan-fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:62px;height:62px;border-radius:22px;border:0;color:var(--ink);background:var(--ac);display:grid;place-items:center;z-index:5;box-shadow:0 0 26px rgba(198,255,52,.55);transition:transform .25s}
#fab:active,#plan-fab:active{transform:scale(.9) rotate(90deg)}
#plan-fab{display:none}
#em{position:fixed;left:0;right:0;top:42%;text-align:center;color:var(--mu);padding:0 40px;pointer-events:none;animation:up .8s both}
#bg,#bg2{position:fixed;inset:0;background:rgba(2,4,14,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:6}
#bg2{z-index:8}#bg.o,#bg2.o{opacity:1;pointer-events:auto}
#sh,#dr,#pk{position:fixed;background:rgba(13,19,42,.94);backdrop-filter:blur(20px);border:1px solid var(--bd);z-index:7;overflow:auto;padding:20px}
#sh,#dr{transition:transform .45s cubic-bezier(.16,1,.3,1)}
#sh{left:0;right:0;bottom:0;max-height:90%;border-radius:26px 26px 0 0;transform:translateY(105%);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
#dr{top:0;bottom:0;left:0;width:82%;max-width:350px;border-radius:0 26px 26px 0;transform:translateX(-105%);padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
#sh.o,#dr.o{transform:none}
#pk{z-index:9;left:7%;right:7%;top:20%;max-height:62%;border-radius:22px;opacity:0;transform:scale(.92) translateY(14px);pointer-events:none;transition:.3s cubic-bezier(.2,.9,.3,1.1)}
#pk.o{opacity:1;transform:none;pointer-events:auto}
input,textarea,select{width:100%;background:rgba(255,255,255,.045);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;margin:6px 0;outline:0;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(198,255,52,.14)}
textarea{resize:vertical}
label,.mu{color:var(--mu);font-size:13px}label{display:block;margin-top:10px}
h2,h3{margin:0 0 6px;font-weight:650}
.fld{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.045);margin:6px 0}
.fld span{flex:1;text-align:left}
#st,#st-task{display:flex;gap:8px;margin:8px 0}#st svg,#st-task svg{cursor:pointer;transition:transform .2s,opacity .2s}#st svg:active,#st-task svg:active{transform:scale(1.25)}
.pri{width:100%;padding:15px;border:0;border-radius:16px;color:var(--ink);font-weight:700;font-size:16px;background:var(--ac);margin-top:14px;box-shadow:0 0 22px rgba(198,255,52,.35);display:flex;justify-content:center;gap:8px;align-items:center}
.bt{display:flex;gap:10px;margin-top:16px}.bt button{flex:1;padding:14px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.05);display:flex;justify-content:center;gap:8px;align-items:center;font-weight:600}
.bt .dn{color:#ff5d7a}.bt .pri{margin:0;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:8px;color:var(--mu);font-size:14px;margin-bottom:12px}
.tx{white-space:pre-wrap;line-height:1.55;margin:0 0 6px}
.ph{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;margin-bottom:14px;animation:up .5s both}
.act{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.045);color:var(--ac);text-decoration:none;margin-top:8px;word-break:break-all}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);animation:up .4s both;animation-delay:calc(var(--i)*40ms)}
.row b{flex:1;font-weight:500}.row small{color:var(--mu)}
.row button,.sw{background:none;border:0;padding:6px;color:var(--mu)}
.dotb{width:26px;height:26px;border-radius:50%;border:0;padding:0;background:currentColor;box-shadow:0 0 12px currentColor}
.sws{display:flex;flex-wrap:wrap;gap:12px;padding:12px 0;animation:up .3s both}
.sws i{width:28px;height:28px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor;cursor:pointer}
.pit{display:flex;align-items:center;gap:12px;padding:14px 8px;border-radius:12px;cursor:pointer;animation:up .35s both;animation-delay:calc(var(--i)*35ms)}
.pit b{flex:1;font-weight:500}.pit:active{background:rgba(255,255,255,.06)}
.add{display:flex;gap:8px;margin-top:10px}.add button{width:50px;border:0;border-radius:14px;background:var(--ac);color:var(--ink);display:grid;place-items:center;margin:6px 0}
#dr{display:flex;flex-direction:column}#dr>*{flex:none}.sp{flex:1 0 16px!important}
#bgi,#mem i{position:fixed;inset:0;background-size:cover;background-position:center;pointer-events:none}
#bgi{opacity:.32;filter:blur(2px) saturate(1.1);display:none}
#bgi::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 15%,var(--bg) 95%)}
#mem i{opacity:0;filter:blur(7px) saturate(1.2);transition:opacity 3s ease}#mem i.o{opacity:.15}
.logo{color:var(--ac);text-shadow:0 0 14px var(--ac);letter-spacing:.12em;margin-bottom:14px}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:15px 12px;margin-bottom:8px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.04);animation:up .4s both;animation-delay:calc(var(--i)*60ms)}
.mi span{flex:1;text-align:left}.mi svg:last-child{transform:rotate(-90deg);opacity:.5}
.bk{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0 14px;font-size:18px;font-weight:650}
.acc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:1px solid var(--bd);background:rgba(255,255,255,.05);backdrop-filter:blur(12px)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(198,255,52,.15);color:var(--ac);font-weight:700}
.bs{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.bs i{width:36px;height:36px;border-radius:12px;border:1px solid var(--bd);cursor:pointer}
#nb{right:12px}#sb{right:66px}#sbar{right:122px}
.bdg{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#ff3d6e;box-shadow:0 0 8px #ff3d6e}
#dt,#cm{top:calc(env(safe-area-inset-top,0px) + 66px);right:69px;width:40px;height:40px;border-radius:14px}
#cm{top:calc(env(safe-area-inset-top,0px) + 114px);opacity:0;transform:translateY(-10px) scale(.8);pointer-events:none;transition:.3s cubic-bezier(.2,.9,.3,1.2);color:var(--ac)}
#cm.o{opacity:1;transform:none;pointer-events:auto}
#ts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-30px);opacity:0;display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(198,255,52,.22),rgba(16,23,50,.92));border:1px solid rgba(198,255,52,.5);color:#e4ff9a;z-index:9;transition:.5s cubic-bezier(.2,.9,.3,1.1);pointer-events:none;white-space:nowrap}
#ts.o{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.tr{text-align:center;padding:10px 0}.big{font:800 54px Delight,system-ui,sans-serif;background:linear-gradient(#f4ffc2,#C6FF34 55%,#7E3BED);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(198,255,52,.6));margin:6px 0}.big small{font-size:20px;margin-left:6px}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.mp{color:#C6FF34;font:700 13px Delight,system-ui,sans-serif;text-shadow:0 0 10px rgba(198,255,52,.6)}.mpb{text-align:center;margin:0 0 14px}.mpb b{display:block}
.chs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chs button{padding:9px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.04);transition:.25s;display:flex;align-items:center;gap:6px}.chs button.on{background:rgba(198,255,52,.16);border-color:var(--ac);color:var(--ac);box-shadow:0 0 12px rgba(198,255,52,.25)}
#ob{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 30px}#ob.o{display:block;animation:up .5s both}.obc{max-width:440px;margin:0 auto}
.shb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.shb a,.shb button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--tx);text-decoration:none;font-size:12px}

/* Reja/vaqt tugmasi va reja oynasi dizayni */
#plan-btn{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:62px;height:62px;border-radius:22px;border:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(14px);display:grid;place-items:center;z-index:5;box-shadow:0 0 20px rgba(198,255,52,.2);transition:transform .25s,box-shadow .25s}
#plan-btn:active{transform:scale(.9)}
#plans-view{position:fixed;inset:0;background:var(--bg);z-index:4;display:none;padding:calc(env(safe-area-inset-top,0px) + 70px) 20px calc(env(safe-area-inset-bottom,0px) + 90px) 20px;overflow-y:auto;opacity:0;transform:translateY(20px);transition:opacity .35s cubic-bezier(.2,.8,.2,1), transform .35s cubic-bezier(.2,.8,.2,1)}
#plans-view.o{display:block;opacity:1;transform:none}
.p-container{max-width:500px;margin:0 auto}
.p-card{background:rgba(255,255,255,.03);border:1px solid var(--bd);backdrop-filter:blur(16px);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.task-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.04);margin-bottom:10px;animation:up .35s both;animation-delay:calc(var(--i)*40ms);transition:all .25s}
.task-item span{font-weight:500;font-size:15px}
.task-item.done .task-title{text-decoration:line-through;color:var(--mu)}
.task-chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;cursor:pointer;transition:all .25s;flex:none}
.task-item.done .task-chk{border-color:#C6FF34;background:#C6FF34;color:var(--ink);box-shadow:0 0 12px rgba(198,255,52,0.5)}
.point-pop{position:fixed;color:#C6FF34;font-family:'Delight',system-ui,sans-serif;font-weight:800;font-size:18px;pointer-events:none;z-index:25;animation:floatUp 1s forwards ease-out;text-shadow:0 0 12px rgba(198,255,52,0.8)}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(1.3)}}

/* ===== YANGI DIZAYN: qora + binafsha + lime + oq ===== */
html[data-th=violet]{--ac:#a67cff;--ink:#fff}
html[data-th=light]{--tx:#14102a;--mu:#6a6585;--gl:rgba(255,255,255,.84);--bd:rgba(20,10,40,.14);--ac:#7E3BED;--ink:#fff;--pn:rgba(255,255,255,.97)}
#aur{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 92% 0%,rgba(126,59,237,.40),transparent 70%),radial-gradient(55% 35% at 0% 100%,rgba(198,255,52,.10),transparent 70%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/44px 44px}
html[data-th=light] #aur{background:radial-gradient(60% 40% at 92% 0%,rgba(126,59,237,.18),transparent 70%)}
#plan-btn{display:none!important}
.ib{color:var(--tx);border-color:rgba(255,255,255,.14);background:linear-gradient(160deg,rgba(126,59,237,.34),var(--gl) 75%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 24px -8px rgba(126,59,237,.85)}
#fab,#plan-fab{bottom:calc(env(safe-area-inset-bottom,0px) + 90px);border-radius:22px;box-shadow:0 0 30px rgba(198,255,52,.5),0 14px 30px -8px rgba(126,59,237,.8)}
#sh,#dr,#pk{background:radial-gradient(110% 55% at 100% 105%,rgba(126,59,237,.40),transparent 62%),radial-gradient(80% 45% at 0% 112%,rgba(198,255,52,.14),transparent 62%),var(--pn);border-color:rgba(255,255,255,.14)}
.p-card,.acc{border-color:rgba(126,59,237,.5);background:linear-gradient(160deg,rgba(126,59,237,.2),rgba(255,255,255,.02))}
.task-item{border-color:rgba(126,59,237,.35)}
#plans-view{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 120px)}
.logo,#plans-view h2{font-family:Delight,system-ui,sans-serif;font-weight:800}
.pri{box-shadow:0 0 24px rgba(198,255,52,.4),0 10px 24px -8px rgba(126,59,237,.7)}
#nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);height:64px;border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;z-index:5;background:var(--gl);backdrop-filter:blur(20px);border:1px solid var(--bd);box-shadow:0 10px 40px -10px rgba(126,59,237,.7),inset 0 1px 0 rgba(255,255,255,.12)}
#nav button{position:relative;background:none;border:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mu);transition:.3s}
#nav button.on{color:var(--ink);background:var(--ac);box-shadow:0 0 22px rgba(198,255,52,.45)}
#nav i{position:absolute;top:3px;right:calc(50% - 24px);min-width:17px;height:17px;border-radius:9px;background:var(--vi);color:#fff;font:700 10px system-ui;display:grid;place-items:center;font-style:normal;padding:0 4px}
#ask{position:fixed;left:14px;right:14px;max-width:460px;margin:0 auto;top:calc(env(safe-area-inset-top,0px) + 72px);z-index:12;padding:16px;border-radius:22px;background:linear-gradient(150deg,rgba(126,59,237,.55),var(--pn) 70%);border:1px solid rgba(198,255,52,.35);backdrop-filter:blur(20px);box-shadow:0 18px 50px -12px rgba(126,59,237,.8);opacity:0;transform:translateY(-24px) scale(.96);pointer-events:none;transition:.45s cubic-bezier(.2,.9,.3,1.1)}
#ask.o{opacity:1;transform:none;pointer-events:auto}
#ask p{margin:0 0 12px;line-height:1.4}.aq{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;color:var(--ac)}.aq b{color:var(--tx);font-weight:600;line-height:1.4}
.ab{display:flex;gap:10px;margin:8px 0}.ab button{flex:1;padding:13px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.07);font-weight:600}.ab .pri{margin:0;background:var(--ac);color:var(--ink)}.ab .dn{color:#ff5d7a}.ab input{margin:0}
.ob2{width:100%;display:flex;justify-content:center;gap:8px;align-items:center;padding:12px;border-radius:14px;border:1px dashed rgba(255,255,255,.28);background:none;color:var(--ac)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.sc{padding:14px 6px;border-radius:18px;border:1px solid rgba(126,59,237,.45);background:linear-gradient(160deg,rgba(126,59,237,.22),transparent);text-align:center}.sc b{display:block;font:800 22px Delight,system-ui;color:var(--ac)}.sc span{font-size:11px;color:var(--mu)}

/* ===== 1-BOSQICH: shrift, 3D, yumshoq animatsiya ===== */
:root{--ios:cubic-bezier(.32,.72,0,1)}
html,body,button,input,textarea,select{font-family:Delight,Onest,system-ui,sans-serif}
body{font-weight:400}
.logo,.big{font-weight:900;letter-spacing:.02em}
h2,h3,.bk{font-weight:700}
.mi span,.chs button,.pri,#nav button,.ab button{font-weight:600}
.mu,small,.sc span{font-weight:340}
.sc b,.mp{font-weight:800}
/* menyu */
#dr .acc{margin:6px 0 16px;cursor:pointer}
.nbd{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:#ff3d6e;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 12px rgba(255,61,110,.7)}
.pen{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;width:44px;height:44px;border-radius:15px;border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;color:var(--ac)}
.pv{text-align:center;padding-top:8px}.pv .av{margin:0 auto 12px}.pv h3{font-size:24px;margin:0 0 12px}
.pvc{justify-content:center;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid rgba(198,255,52,.4);background:linear-gradient(160deg,rgba(126,59,237,.35),rgba(255,255,255,.03));font-size:13px;font-weight:600}
/* yuqori tugmalar: qidiruv + 3 nuqta yonma-yon, bildirishnoma menyuda */
#nb{display:none!important}
#dt{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:46px;height:46px;border-radius:16px}
#cm{top:calc(env(safe-area-inset-top,0px) + 66px);right:12px;width:auto;height:auto;padding:12px 16px;border-radius:18px;grid-auto-flow:column;gap:10px;align-items:center;font-size:14px;font-weight:600;color:var(--tx)}
#cm svg{color:var(--ac)}
/* 3D ikonkalar */
.ib,.pen,#cm{background:linear-gradient(165deg,rgba(255,255,255,.18),rgba(126,59,237,.32) 42%,rgba(10,8,20,.88));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.38),inset 0 -7px 12px rgba(0,0,0,.4),0 14px 24px -9px rgba(126,59,237,.9),0 2px 0 rgba(0,0,0,.45)}
.ib:active,.pen:active{transform:translateY(2px) scale(.95);box-shadow:inset 0 3px 9px rgba(0,0,0,.55),0 4px 10px -4px rgba(126,59,237,.8)}
.ib svg,.pen svg,#nav svg,.mi svg:first-child{filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.mi svg:first-child{box-sizing:content-box;padding:9px;border-radius:14px;background:linear-gradient(165deg,rgba(255,255,255,.16),rgba(126,59,237,.34) 50%,rgba(10,8,20,.85));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -5px 8px rgba(0,0,0,.35),0 8px 14px -6px rgba(126,59,237,.85)}
#nav button svg{transition:transform .5s var(--ios)}#nav button.on svg{transform:translateY(-2px) scale(1.12)}
/* jins tugmalari */
#pfg button{display:inline-flex;align-items:center;gap:8px;padding:12px 18px}
#pfg button[data-g=m] svg{color:#a78bfa}#pfg button[data-g=f] svg{color:var(--ac)}
#pfg button.on{box-shadow:0 0 22px rgba(198,255,52,.45)}#pfg button.on svg{color:inherit}
/* iPhone kabi yumshoq harakat */
#sh,#dr{transition:transform .55s var(--ios)}
#bg,#bg2{transition:opacity .45s ease}
#ask{transition:transform .6s var(--ios),opacity .4s}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.mi,.rr,.pit,.chs button,.pri,.ib,#nav button,.ab button,.acc{transition:transform .4s var(--ios),box-shadow .4s,background .3s}
.mi:active,.rr:active,.pit:active,.chs button:active,.pri:active,#nav button:active,.acc:active{transform:scale(.97)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}


/* ===== 2-3 BOSQICH: vazifalar + profil ===== */
.em{vertical-align:middle;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
#plans-view .p-container{max-width:520px;margin:0 auto}

function showPointPop(text, x, y) {
  const pop = document.createElement('div');
  pop.className = 'point-pop';
  pop.innerText = text;
  pop.style.left = `${x}px`;
  pop.style.top = `${y}px`;

  setTimeout(() => pop.remove(), 1000);

$("tasks-container").onclick = e => {
  const chkBtn = e.target.closest("[data-chk]");
  if(chkBtn) {
    const ts = S.tasks.find(x => x.id === chkBtn.dataset.chk);
    if(ts) {
      ts.done = !ts.done;
      const rect = chkBtn.getBoundingClientRect();
      if(ts.done) {
        S.taskMp = (S.taskMp || 0) + 10; act(1);
        showPointPop("+10 MP", rect.left, rect.top);
      } else {
        S.taskMp = Math.max(0, (S.taskMp || 0) - 10);
      }
      save(); upd(); renderTasks();
    }
    return;
  }
  const editBtn = e.target.closest("[data-edit]");
  if(editBtn) {
    const ts = S.tasks.find(x => x.id === editBtn.dataset.edit);
    if(ts) taskForm(ts);
    return;
  }
  const delBtn = e.target.closest("[data-deltask]");
  if(delBtn) {
    S.tasks = S.tasks.filter(x => x.id !== delBtn.dataset.deltask);
    save(); upd(); renderTasks();
  }
};
